plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.24' }
version = '4.5.6'
group = 'cn.blockforge.generated.generatedmod'
base { archivesName = 'generated_mod' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    compileOnly files('libs/MCphone-0.10.2.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    def props = [mod_id: 'generated_mod', mod_name: 'MCphone Market Expansion', mod_version: project.version,
                 minecraft_version: '1.20.1', forge_version: '47.4.0']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
}
jar.finalizedBy('reobfJar')
